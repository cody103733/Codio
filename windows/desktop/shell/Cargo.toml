[package]
name = "codio"
version = "1.6.6"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Codio for Windows: the desktop window (WebView2 interface and mpv player)"

[dependencies]
webview2-com = "0.39"
serde_json = "1"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Security",
]


[profile.release]
opt-level = 3
lto = true
codegen-units = 1