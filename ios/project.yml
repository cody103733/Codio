name: Codio
options:
  bundleIdPrefix: com.codio
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "0.6.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Codio:
    type: application
    platform: iOS
    sources:
      - path: Codio
        excludes: ["codio-engine.js"]
      - path: Codio/codio-engine.js
        buildPhase: resources
      - path: web
        type: folder
        buildPhase: resources
    info:
      path: Codio/Info.plist
      properties:
        CFBundleDisplayName: Codio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationLandscapeLeft]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationLandscapeLeft]
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
        NSLocalNetworkUsageDescription: Codio runs its interface from a small server inside the app.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codio.ios
        PRODUCT_NAME: Codio
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ENABLE_BITCODE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    scheme: {}
